apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.service_name }}
  namespace: ${{ values.team_name }}
  labels:
    app.kubernetes.io/name: ${{ values.service_name }}
    team: ${{ values.team_name }}
    cost-center: CC-${{ values.team_name | replace("-", "") | upper }}-001
    environment: dev
    owner: ${{ values.team_name }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ${{ values.service_name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${{ values.service_name }}
        team: ${{ values.team_name }}
        cost-center: CC-${{ values.team_name | replace("-", "") | upper }}-001
        environment: dev
        owner: ${{ values.team_name }}
    spec:
      serviceAccountName: ${{ values.service_name }}
      containers:
        - name: app
          image: 123456789012.dkr.ecr.me-central-1.amazonaws.com/${{ values.service_name }}:v1.0.0
          ports:
            - containerPort: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
