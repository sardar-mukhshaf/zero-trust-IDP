kubecostProductConfigs:
  clusterName: ztidp-dev
  currencyCode: "USD"
  defaultTeamId: "platform"

prometheus:
  server:
    retention: "30d"
    persistentVolume:
      enabled: true
      size: 32Gi

costAllocation:
  sharedNamespaces: "kube-system,istio-system,cert-manager,gatekeeper-system"
  sharedLabelNames: "team,cost-center"
  sharedLabelValues: "platform,CC-PLATFORM-000"

notifications:
  alertConfigs:
    enabled: true
    globalAlertEmails:
      - platform-alerts@example.com
    alerts:
      - type: budget
        threshold: 500
        window: 1d
        aggregation: namespace
      - type: spendChange
        relativeThreshold: 0.50
        window: 7d
        aggregation: namespace

aws:
  payerAccountID: "123456789012"
  cur:
    enabled: true
    bucketName: "123456789012-cur-reports"
    region: "us-east-1"
    prefix: "daily-cur/"

reporting:
  exportToCSV:
    enabled: true
    storage:
      enabled: true
      bucketName: "ztidp-dev-kubecost-reports"
