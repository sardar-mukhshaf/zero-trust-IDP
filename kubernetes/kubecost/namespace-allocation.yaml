apiVersion: v1
kind: ConfigMap
metadata:
  name: namespace-allocation
  namespace: kubecost
  labels:
    app.kubernetes.io/name: namespace-allocation
    team: platform
    cost-center: CC-PLATFORM-000
    environment: production
    owner: platform-team
data:
  allocation.json: |
    {
      "teams": [
        {
          "name": "team-backend",
          "cost_center": "CC-BACKEND-001",
          "namespaces": ["team-backend"]
        },
        {
          "name": "team-frontend",
          "cost_center": "CC-FRONTEND-002",
          "namespaces": ["team-frontend"]
        },
        {
          "name": "team-data",
          "cost_center": "CC-DATA-003",
          "namespaces": ["team-data"]
        },
        {
          "name": "team-sre",
          "cost_center": "CC-SRE-004",
          "namespaces": ["team-sre"]
        }
      ]
    }
