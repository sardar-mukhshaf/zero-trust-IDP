apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: kaniko-build
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/name: kaniko-build
    team: platform
    cost-center: CC-PLATFORM-000
    environment: production
    owner: platform-team
spec:
  description: >-
    Build a multi-arch container image using Kaniko and push to ECR.
  workspaces:
    - name: source
    - name: dockerconfig
      description: Docker config for ECR authentication
  params:
    - name: image-name
      type: string
      description: Full ECR image name (registry/repo:tag).
    - name: dockerfile
      type: string
      default: Dockerfile
    - name: context
      type: string
      default: .
  steps:
    - name: build-and-push
      image: gcr.io/kaniko-project/executor:v1.20.0@sha256:abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      args:
        - --dockerfile=$(params.dockerfile)
        - --context=$(workspaces.source.path)/$(params.context)
        - --destination=$(params.image-name)
        - --snapshot-mode=redo
        - --use-new-run
        - --platform=linux/amd64,linux/arm64
      env:
        - name: DOCKER_CONFIG
          value: $(workspaces.dockerconfig.path)
      resources:
        limits:
          cpu: 2000m
          memory: 2Gi
        requests:
          cpu: 500m
          memory: 512Mi
