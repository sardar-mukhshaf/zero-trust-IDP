apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: terraform-plan
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/name: terraform-plan
    team: platform
    cost-center: CC-PLATFORM-000
    environment: production
    owner: platform-team
spec:
  description: >-
    Run terraform plan and output a JSON representation for policy scanning.
  workspaces:
    - name: source
  params:
    - name: workspace-dir
      type: string
      default: .
    - name: environment
      type: string
  steps:
    - name: terraform-plan
      image: hashicorp/terraform:1.7.0@sha256:abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      script: |
        #!/bin/sh
        set -euo pipefail
        cd $(workspaces.source.path)/$(params.workspace-dir)
        terraform init -backend=false
        terraform validate
        terraform plan -out=tfplan -var-file=environments/$(params.environment).tfvars
        terraform show -json tfplan > tfplan.json
      resources:
        limits:
          cpu: 1000m
          memory: 1Gi
        requests:
          cpu: 250m
          memory: 256Mi
