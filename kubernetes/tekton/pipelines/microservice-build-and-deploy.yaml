apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: microservice-build-and-deploy
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/name: microservice-build-and-deploy
    team: platform
    cost-center: CC-PLATFORM-000
    environment: production
    owner: platform-team
spec:
  description: >-
    Build, scan, and deploy a microservice to EKS.
  workspaces:
    - name: shared-workspace
    - name: dockerconfig
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
      default: main
    - name: image-name
      type: string
    - name: namespace
      type: string
    - name: service-account
      type: string
      default: default
  tasks:
    - name: git-clone
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: shared-workspace
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
    - name: sonarqube-scan
      taskRef:
        name: sonarqube-scan
      runAfter:
        - git-clone
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: project-key
          value: $(params.namespace)
    - name: kaniko-build
      taskRef:
        name: kaniko-build
      runAfter:
        - sonarqube-scan
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: dockerconfig
          workspace: dockerconfig
      params:
        - name: image-name
          value: $(params.image-name)
    - name: opa-scan
      taskRef:
        name: opa-gatekeeper-scan
      runAfter:
        - kaniko-build
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: deploy
      taskRef:
        name: kubernetes-actions
        kind: ClusterTask
      runAfter:
        - opa-scan
      params:
        - name: script
          value: |
            kubectl apply -f $(workspaces.source.path)/kubernetes/ -n $(params.namespace)
      workspaces:
        - name: manifest-dir
          workspace: shared-workspace
  finally:
    - name: notify
      taskSpec:
        steps:
          - name: notify-slack
            image: curlimages/curl:8.5.0
            script: |
              echo "PipelineRun $(context.pipelineRun.name) completed with status $(context.pipelineRun.status)"
