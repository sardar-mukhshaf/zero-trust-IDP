apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredLabels
metadata:
  name: require-platform-labels
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod", "Deployment", "Service"]
    scope: Namespaced
  parameters:
    labels:
      - app.kubernetes.io/name
      - team
      - cost-center
      - environment
      - owner
